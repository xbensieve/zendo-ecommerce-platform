spring:
  config:
    activate:
      on-profile: prod

  # In production, all these values MUST be injected via environment variables.
  # The application will fail fast on startup if they are missing.
  
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

server:
  forward-headers-strategy: framework

zendo:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:zendo-production}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    event:
      signing-secret: ${EVENT_SIGNING_SECRET}
    rate-limiter:
      trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1,10.0.0.0/8}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never # Secure health details in prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
